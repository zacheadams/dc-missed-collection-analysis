name: Scheduled 311 Data Refresh

on:
  # schedule:
  #   # Scheduled runs disabled (previously ran every Monday at 10:00 AM UTC)
  #   - cron: '0 10 * * 1'
  workflow_dispatch:
    # Allows manual trigger via the GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: dc-missed-collections-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Run data refresh pipeline
        run: python scripts/update_pipeline.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.geojson index.html map.html report.html tables.html
          if git diff --staged --quiet; then
            echo "No data or application changes detected. Repository is already up to date."
          else
            git commit -m "Automated data refresh: $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
