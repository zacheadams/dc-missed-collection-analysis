name: Scheduled 311 Data Refresh

on:
  # schedule:
  #   # Scheduled runs disabled (previously ran every Monday at 10:00 AM UTC)
  #   - cron: '0 10 * * 1'
  workflow_dispatch:
    # Allows manual trigger via the GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: dc-missed-collections-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dc-missed-collection-analysis
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: dc-missed-collections

      - name: Check out dc-311-sentinel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zacheadams/dc-311-sentinel
          path: dc-311-sentinel

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Cache 2025-2026 raw Parquet files
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: dc-311-sentinel/data/raw
          key: dc-311-raw-parquet-v1-${{ hashFiles('dc-311-sentinel/scripts/fetch_311_data.py') }}
          restore-keys: |
            dc-311-raw-parquet-v1-

      - name: Install Python dependencies
        run: pip install -r dc-311-sentinel/requirements.txt -r dc-missed-collections/requirements.txt

      - name: Refresh shared dc-311-sentinel warehouse
        working-directory: dc-311-sentinel
        run: |
          python scripts/fetch_boundaries.py
          python scripts/fetch_weather.py
          python scripts/fetch_311_data.py
          python scripts/build_warehouse.py

      - name: Run missed-collections pipeline
        working-directory: dc-missed-collections
        env:
          SENTINEL_DIR: ${{ github.workspace }}/dc-311-sentinel
        run: python scripts/update_pipeline.py

      - name: Commit and push changes
        working-directory: dc-missed-collections
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.geojson index.html map.html report.html tables.html
          if git diff --staged --quiet; then
            echo "No data or application changes detected. Repository is already up to date."
          else
            git commit -m "Automated data refresh: $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
