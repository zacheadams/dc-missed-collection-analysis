name: Scheduled 311 Data Refresh

on:
  schedule:
    # Runs every Monday at 10:00 AM UTC (6:00 AM EDT)
    - cron: '0 10 * * 1'
  workflow_dispatch:
    # Allows manual trigger via the GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run data refresh pipeline
        run: python scripts/update_pipeline.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json index.html map.html report.html
          if git diff --staged --quiet; then
            echo "No data or application changes detected. Repository is already up to date."
          else
            git commit -m "Automated data refresh: $(date +'%Y-%m-%d')"
            git push
          fi
